<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LingoHut Malay - redesign prototype</title>
<style>
:root{--bg:#EDEBF7;--card:#fff;--soft:#F4F3FA;--text:#1d1b2e;--mut:#6b6880;--line:#e3e1ee;--pu:#534AB7;--pl:#EEEDFE;--pt:#3C3489;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121019;--card:#1c1a28;--soft:#26233a;--text:#f0eefa;--mut:#a6a2bd;--line:#332f4a;--pl:#2d2a52;--pt:#CECBF6}}
:root[data-theme="dark"]{--bg:#121019;--card:#1c1a28;--soft:#26233a;--text:#f0eefa;--mut:#a6a2bd;--line:#332f4a;--pl:#2d2a52;--pt:#CECBF6}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;background:var(--card);position:relative}
@media(min-width:520px){body{padding:16px 0}#app{border-radius:28px;border:1px solid var(--line);overflow:hidden}}
main{flex:1;overflow-y:auto;padding:16px}
h1{font-size:21px;margin:0 0 2px;font-weight:600}h2{font-size:16px;margin:18px 0 8px;font-weight:600}
.mut{color:var(--mut);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.row{display:flex;align-items:center;gap:12px}
.card{border-radius:16px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{border:1px solid var(--line);border-radius:12px;padding:11px 14px;text-align:center;font-weight:500}
.pri{background:var(--pu);border-color:var(--pu);color:#fff}
.bar{height:6px;border-radius:3px;background:rgba(127,119,221,.3)}.bar i{display:block;height:100%;border-radius:3px;background:#AFA9EC}
.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px 0 10px;background:var(--card)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);min-width:64px}
.tabs button.on{color:var(--pu)}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.dot{width:34px;height:34px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--mut);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--pl);color:var(--pt);border-radius:99px;padding:6px 13px;font-size:13px}.chip.on{background:var(--pu);color:#fff}
input[type=search]{width:100%;font:inherit;padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--soft);color:var(--text)}
.ms{color:var(--pu);font-weight:600}
.play{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:var(--pu);display:flex;align-items:center;justify-content:center;flex:none}
#toast{position:absolute;left:16px;right:16px;bottom:78px;background:#26215C;color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.rec{background:#1D9E75;color:#fff;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}.rec.on{background:#D6453D}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:500}details p{margin:8px 0 0;color:var(--mut);font-size:14px}
.fc{height:190px;border-radius:18px;background:var(--pl);color:var(--pt);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
var IC={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',books:'<path d="M4 5h6v15H4zM12 5h8v15h-8z"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',pause:'<path d="M7 4h3v16H7zM14 4h3v16h-3z" fill="currentColor"/>',back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>',check:'<path d="M5 12l5 5 9-10"/>'};
function ic(n,s){s=s||22;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
var G={b:["Basics","#E1F5EE","#085041"],t:["Time","#FAEEDA","#633806"],n:["Numbers","#E6F1FB","#0C447C"],s:["School","#FAECE7","#712B13"],w:["Nature","#EAF3DE","#27500A"]};
var L=[["Meeting someone","b"],["Please and thank you","b"],["Celebrations and parties","b"],["Peace on earth","b"],["Feelings and emotions","b"],["Days of the week","t"],["Months of the year","t"],["Numbers 1 through 10","n"],["Numbers 11 through 20","n"],["Numbers 21 through 30","n"],["Numbers 10 through 100","n"],["Numbers 100 through 1000","n"],["Numbers 1000 through 10000","n"],["School supplies","s"],["Classroom","s"],["School subjects","s"],["Colors","w"],["Geography","w"],["Astronomy","w"],["Solar system","w"],["Seasons and weather","w"]];
var P=[["Hello","Helo"],["Good morning","Selamat pagi"],["Good afternoon","Selamat tengah hari"],["Good evening","Selamat petang"],["Good night","Selamat malam"],["What is your name?","Siapa nama awak?"],["My name is ___","Nama saya ialah ___"],["Sorry, I did not hear you","Maaf, saya tidak dengar"],["Where do you live?","Di mana awak tinggal?"],["Where are you from?","Awak berasal dari mana?"],["How are you?","Apa khabar?"],["Fine, thank you","Khabar baik, terima kasih"],["And you?","Awak pula?"],["Nice to meet you","Selamat berkenalan"],["Nice to see you","Gembira berjumpa dengan awak"],["Have a nice day","Salam sejahtera"],["See you later","Jumpa lagi"],["See you tomorrow","Jumpa kamu esok"],["Goodbye","Selamat tinggal"]];
var GAMES=[["Flashcards","#EEEDFE","#3C3489"],["Matching game","#E1F5EE","#085041"],["Tic-tac-toe","#FBEAF0","#72243E"],["Concentration game","#FAECE7","#712B13"],["Listening game","#E6F1FB","#0C447C"]];
var S={tab:"home",view:null,i:0,playing:false,rec:false,done:false,flip:false,all:false,q:"",cat:"all",heard:{}},tm,pt;
var $=function(id){return document.getElementById(id)};
function toast(m){var t=$("toast");t.textContent=m;t.className="on";clearTimeout(tm);tm=setTimeout(function(){t.className=""},1800)}
function say(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="ms-MY";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function go(tab,view){S.tab=tab;S.view=view||null;S.flip=false;R()}
function openLesson(n,idx){if(n!==0){toast("Only Lesson 1 is in this prototype");return}S.i=idx||S.i;go("lessons","lesson")}
function hear(i){S.heard[i]=1;S.i=i;S.playing=true;say(P[i][1]);clearTimeout(pt);pt=setTimeout(function(){S.playing=false;R()},1800);R()}
function toggle(){if(S.playing){S.playing=false;try{speechSynthesis.cancel()}catch(e){}R()}else hear(S.i)}
function step(d){var n=S.i+d;if(n<0)return;if(n>=P.length){S.done=true;toast("Lesson 1 complete");go("lessons");return}S.i=n;S.playing=false;S.heard[n]=1;R()}
function rec(){S.rec=!S.rec;if(!S.rec)toast("Recording saved (prototype)");R()}
function status(n){return n===0&&S.done?"done":n===0&&Object.keys(S.heard).length?"prog":n===1&&S.done?"next":"none"}
function rows(){var q=S.q.toLowerCase(),o="",last="";L.forEach(function(l,n){if(S.cat!=="all"&&l[1]!==S.cat)return;if(q&&l[0].toLowerCase().indexOf(q)<0)return;var g=G[l[1]];if(last!==l[1]){o+='<div style="margin:16px 0 0;font-weight:600;font-size:14px;color:'+g[2]+'"><span style="background:'+g[1]+';padding:3px 10px;border-radius:99px">'+g[0]+'</span></div>';last=l[1]}var st=status(n),sub=st==="done"?"Completed":st==="prog"?"In progress":st==="next"?"Up next":"Not started";o+='<button class="li" onclick="openLesson('+n+')"><span class="dot" style="'+(st==="done"?"background:#E1F5EE;color:#0F6E56":st==="prog"?"background:var(--pl);color:var(--pu)":"")+'">'+(st==="done"?ic("check",18):n+1)+'</span><span style="flex:1"><b style="font-weight:500">'+l[0]+'</b><br><span class="mut">Lesson '+(n+1)+' - '+sub+'</span></span><span class="mut">'+ic("chev",18)+'</span></button>'});return o||'<p class="mut" style="margin-top:20px">No lessons match your search.</p>'}
function filt(v){S.q=v;$("list").innerHTML=rows()}
function games(){return GAMES.map(function(g,k){return '<button class="card" style="background:'+g[1]+';color:'+g[2]+';font-weight:600;text-align:left;'+(k===4?"grid-column:1/-1":"")+'" onclick="'+(k===0?"S.i=0;go('lessons','flash')":"toast('Only Flashcards is in this prototype')")+'">'+g[0]+'</button>'}).join("")}
function vHome(){var p=Math.round(S.i/19*100),h=Math.min(5,Object.keys(S.heard).length);return '<h1>Selamat pagi</h1><div class="mut">Ready for your 5 minutes?</div><div class="card" style="background:#534AB7;color:#fff;margin-top:14px"><div style="font-size:12px;color:#CECBF6">Continue learning</div><div style="font-size:18px;font-weight:600;margin:2px 0 12px">Lesson 1 - Meeting someone</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="row" style="justify-content:space-between;margin-top:12px"><span style="font-size:12px;color:#CECBF6">Phrase '+(S.i+1)+' of 19 - Today '+h+'/5</span><button onclick="openLesson(0)" style="background:#fff;color:#3C3489;border-radius:99px;padding:8px 14px;font-weight:600;font-size:13px">Resume</button></div></div><h2>Free lessons</h2><div class="grid">'+[0,1,2,5].map(function(n){var g=G[L[n][1]];return '<button class="card" style="background:'+g[1]+';color:'+g[2]+';text-align:left" onclick="openLesson('+n+')"><div style="font-size:12px">Lesson '+(n+1)+'</div><div style="font-weight:600">'+L[n][0]+'</div></button>'}).join("")+'</div><button class="btn" style="width:100%;margin-top:12px" onclick="go(\'lessons\')">See all 125 lessons</button>'}
function vLessons(){return '<h1>Lessons</h1><div class="mut">125 free Malay lessons</div><div style="margin-top:12px"><input type="search" placeholder="Search lessons" oninput="filt(this.value)" value="'+S.q+'" aria-label="Search lessons"></div><div class="chips">'+[["all","All"],["b","Basics"],["t","Time"],["n","Numbers"],["s","School"],["w","Nature"]].map(function(c){return '<button class="chip'+(S.cat===c[0]?" on":"")+'" onclick="S.cat=\''+c[0]+'\';R()">'+c[1]+'</button>'}).join("")+'</div><div id="list">'+rows()+'</div><p class="mut" style="margin-top:14px">Showing the first 21 of 125 lessons in this prototype.</p>'}
function vLesson(){var p=P[S.i],n=S.all?19:4;return '<div class="row"><button onclick="go(\'lessons\')" aria-label="Back">'+ic("back")+'</button><div><div class="mut">Malay - Lesson 1</div><h1 style="font-size:18px">Meeting someone</h1></div></div><div style="background:#26215C;border-radius:16px;overflow:hidden;margin-top:14px;color:#fff"><div style="padding:16px 16px 22px;text-align:center;position:relative"><div style="position:absolute;right:14px;top:12px;font-size:12px;color:#CECBF6">'+(S.i+1)+' / 19</div><div style="color:#CECBF6;font-size:14px;margin-top:14px">'+p[0]+'</div><div style="font-size:26px;font-weight:600;margin:6px 0 14px">'+p[1]+'</div><button onclick="toggle()" aria-label="Play or pause" style="width:56px;height:56px;border-radius:50%;background:#7F77DD;color:#fff;display:inline-flex;align-items:center;justify-content:center">'+ic(S.playing?"pause":"play",26)+'</button></div><div class="row" style="background:#3C3489;padding:10px 12px;gap:12px"><button onclick="toggle()" aria-label="Pause" style="color:#EEEDFE">'+ic(S.playing?"pause":"play",20)+'</button><div class="bar" style="flex:1"><i style="width:'+Math.round((S.i+1)/19*100)+'%"></i></div><button class="rec'+(S.rec?" on":"")+'" onclick="rec()">'+ic("mic",16)+(S.rec?"Stop":"Record")+'</button></div></div><div class="row" style="margin-top:10px"><button class="btn" style="flex:1" onclick="step(-1)">Previous</button><button class="btn pri" style="flex:1" onclick="step(1)">'+(S.i===18?"Finish":"Next phrase")+'</button></div><h2>Practice this lesson</h2><div class="grid">'+games()+'</div><h2>All 19 phrases</h2>'+P.slice(0,n).map(function(x,k){return '<div class="li" style="cursor:pointer" onclick="hear('+k+')"><span style="flex:1"><span class="mut">'+x[0]+'</span><br><span class="ms">'+x[1]+'</span></span><span class="play">'+ic("play",16)+'</span></div>'}).join("")+'<button class="btn" style="width:100%;margin-top:12px" onclick="S.all=!S.all;R()">'+(S.all?"Show fewer":"Show all 19 phrases")+'</button><div class="card row" style="background:var(--pl);margin-top:14px;justify-content:space-between"><div><div class="mut">Next lesson</div><b>2 - Please and thank you</b></div><button onclick="openLesson(1)" aria-label="Next lesson">'+ic("chev")+'</button></div>'}
function vFlash(){var p=P[S.i];return '<div class="row"><button onclick="go(\'lessons\',\'lesson\')" aria-label="Back">'+ic("back")+'</button><h1 style="font-size:18px">Flashcards</h1><span class="mut" style="margin-left:auto">'+(S.i+1)+' / 19</span></div><button class="fc" style="margin-top:20px" onclick="S.flip=!S.flip;if(S.flip)say(p_());R()"><div class="mut" style="color:inherit;opacity:.7">'+(S.flip?"Malay":"English")+'</div><div style="font-size:24px;font-weight:600;margin-top:6px">'+(S.flip?p[1]:p[0])+'</div><div class="mut" style="margin-top:14px;color:inherit;opacity:.7">Tap to flip</div></button><div class="row" style="margin-top:14px"><button class="btn" style="flex:1" onclick="fl(-1)">Previous</button><button class="btn pri" style="flex:1" onclick="fl(1)">Next</button></div>'}
function p_(){return P[S.i][1]}
function fl(d){var n=S.i+d;if(n<0||n>18)return;S.i=n;S.flip=false;R()}
function vPractice(){return '<h1>Practice</h1><div class="mut">Games for Lesson 1 - Meeting someone</div><div class="grid" style="margin-top:14px">'+games()+'</div><h2>Speaking practice</h2><div class="card row" style="background:var(--pl)"><span style="color:var(--pu)">'+ic("mic",26)+'</span><div style="flex:1"><b>Record yourself</b><div class="mut">Listen, then say each phrase aloud.</div></div><button class="btn pri" onclick="openLesson(0)">Start</button></div>'}
function vProfile(){return '<h1>Profile</h1><div class="mut">Your languages and links</div><button class="li" style="margin-top:10px" onclick="toast(\'Language switching is not in this prototype\')"><span style="flex:1">I want to learn</span><span class="mut">Malay '+ic("chev",16)+'</span></button><button class="li" onclick="toast(\'Language switching is not in this prototype\')"><span style="flex:1">I speak</span><span class="mut">English '+ic("chev",16)+'</span></button><button class="li" onclick="toast(\'ESL is not in this prototype\')"><span style="flex:1">ESL</span><span class="mut">'+ic("chev",16)+'</span></button><button class="li" onclick="toast(\'Blog is not in this prototype\')"><span style="flex:1">Blog</span><span class="mut">'+ic("chev",16)+'</span></button><button class="li" onclick="go(\'profile\',\'about\')"><span style="flex:1">About LingoHut</span><span class="mut">'+ic("chev",16)+'</span></button><div class="row" style="justify-content:center;margin-top:20px;gap:10px"><button class="btn" onclick="toast(\'YouTube link\')">YouTube</button><button class="btn" onclick="toast(\'Facebook link\')">Facebook</button><button class="btn" onclick="toast(\'Instagram link\')">Instagram</button></div>'}
function vAbout(){var d=[["Learning for travel","Learn greetings, numbers, and everyday phrases before you go, so you can chat with locals with confidence."],["Learning for work","Short daily lessons fit around a busy schedule and help you connect with colleagues and clients."],["For homeschoolers and teachers","Free lessons, games, and audio can support classroom and home learning."],["How the 5-minute method works","Watch a short phrase video, say it aloud, record yourself, then play a quick game."],["FAQ, contact, and legal","Find help, get in touch, and read the site policies."]];return '<div class="row"><button onclick="go(\'profile\')" aria-label="Back">'+ic("back")+'</button><h1 style="font-size:18px">About LingoHut</h1></div><div class="mut" style="margin:6px 0 8px">Free lessons in 5 minutes a day.</div>'+d.map(function(x){return '<details><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>'}).join("")+'<button class="btn pri" style="width:100%;margin-top:16px" onclick="toast(\'Thank you for supporting LingoHut\')">Donate</button>'}
function R(){var v=S.view==="lesson"?vLesson():S.view==="flash"?vFlash():S.view==="about"?vAbout():({home:vHome,lessons:vLessons,practice:vPractice,profile:vProfile})[S.tab]();var t=[["home","Home","home"],["lessons","Lessons","books"],["practice","Practice","mic"],["profile","Profile","user"]];$("app").innerHTML='<main>'+v+'</main><nav class="tabs">'+t.map(function(x){return '<button class="'+(S.tab===x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')">'+ic(x[2])+x[1]+'</button>'}).join("")+'</nav><div id="toast"></div>'}
R();
</script>
</body>
</html>
